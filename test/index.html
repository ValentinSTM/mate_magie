<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mate-Magie</title>
<meta name="theme-color" content="#5b3cc4">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f0ff; --card:#fff; --ink:#2b2350; --muted:#7a7399;
  --pri:#5b3cc4; --pri2:#8b6cf0; --ok:#1fa463; --okl:#d8f5e6; --warn:#f29d16; --warnl:#ffefd2;
  --bad:#e5484d; --badl:#ffe1e2; --c1:#4f7cff; --c2:#ff8a3d; --c3:#c9c3e6; --gold:#ffc83d;
  --r:18px; --sh:0 4px 14px rgba(60,40,140,.12);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Nunito","Trebuchet MS","Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);
  -webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation;
  overscroll-behavior-y:contain;padding-bottom:env(safe-area-inset-bottom)}
button{font-family:inherit;cursor:pointer;border:0;touch-action:manipulation}
input,select{user-select:text;-webkit-user-select:text}
header{display:flex;align-items:center;gap:8px;padding:10px 14px;padding-top:max(10px,env(safe-area-inset-top));background:var(--pri);color:#fff;position:sticky;top:0;z-index:5}
header h1{font-size:19px;margin:0;flex:1;cursor:pointer;white-space:nowrap}
.pill{background:rgba(255,255,255,.18);padding:6px 10px;border-radius:99px;font-weight:800;font-size:14px;white-space:nowrap}
.lang-btn{background:rgba(255,255,255,.18);color:#fff;border-radius:99px;padding:6px 10px;font-weight:800;font-size:14px}
body.focus header{display:none}
main{max-width:760px;margin:0 auto;padding:14px}
.screen{display:none}.screen.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:.3;transform:translateY(6px)}to{opacity:1}}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big-btn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:14px;border-radius:var(--r);
  background:var(--card);box-shadow:var(--sh);color:var(--ink);font-size:17px;font-weight:800;transition:transform .1s;width:100%}
.big-btn small{font-size:13px;font-weight:600;color:var(--muted)}
.big-btn .ico{font-size:30px}
.big-btn:active{transform:scale(.97)}
.hero{background:linear-gradient(135deg,var(--pri),#8b5cf6);color:#fff;font-size:24px;padding:20px;align-items:center;text-align:center;margin-bottom:12px}
.hero small{color:#efe9ff;font-size:15px}
.hl{outline:3px solid var(--gold);animation:pulse 1.6s infinite}
@keyframes pulse{50%{outline-color:transparent}}
.btn{background:var(--pri);color:#fff;font-size:18px;font-weight:800;padding:12px 20px;border-radius:14px}
.btn.sec{background:#e9e3ff;color:var(--pri)}
.btn.ok{background:var(--ok)}
.btn.sm{font-size:15px;padding:8px 14px}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
h2{margin:4px 0 12px;font-size:22px}
h3{margin:4px 0 8px;font-size:18px}
.muted{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:10px 14px;border-radius:12px;background:#eee9ff;color:var(--pri);font-weight:800;font-size:16px;border:2px solid transparent}
.chip.on{background:var(--pri);color:#fff}
/* buddy */
.buddy{display:flex;align-items:flex-end;gap:10px;margin-bottom:12px}
.buddy .av{font-size:56px;line-height:1;animation:bob 2.4s ease-in-out infinite;cursor:pointer}
@keyframes bob{50%{transform:translateY(-6px)}}
.bubble{position:relative;background:#fff;border-radius:18px;padding:12px 14px;font-size:18px;font-weight:700;box-shadow:var(--sh);flex:1}
.bubble::before{content:"";position:absolute;left:-8px;bottom:14px;border:8px solid transparent;border-right-color:#fff;border-left:0}
.stat-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.stat-row .pill{background:#fff;color:var(--ink);box-shadow:var(--sh);font-size:15px;padding:8px 12px}
/* quiz */
.qtop{display:flex;align-items:center;gap:8px}
.path{flex:1;display:flex;align-items:center;gap:3px}
.path i{flex:1;height:10px;border-radius:6px;background:#e2dcfb}
.path i.d{background:var(--pri2)}.path i.now{background:var(--gold)}
.path b{font-size:22px}
.combo{font-weight:900;font-size:18px;min-width:44px;text-align:right;color:#e2602a}
.iconbtn.on{background:var(--pri);color:#fff}
.iconbtn{width:42px;height:42px;border-radius:12px;background:#eee9ff;color:var(--pri);font-size:20px;font-weight:900;flex:none}
.qbuddy{display:flex;align-items:center;gap:8px;min-height:46px;margin:8px 0 0}
.qbuddy .av{font-size:36px}
.qbuddy .bubble{font-size:16px;padding:8px 12px;opacity:0;transition:opacity .25s}
.qbuddy .bubble.on{opacity:1}
.qbox{text-align:center;padding:12px 10px}
.bonus{display:inline-block;background:var(--gold);color:#5a3b00;font-weight:900;border-radius:10px;padding:3px 10px;font-size:15px}
.qtext{font-size:clamp(40px,13vw,60px);font-weight:900;letter-spacing:1px;margin:4px 0 8px}
.qtext .eq{color:var(--muted)}
.answers{display:flex;justify-content:center;gap:12px;align-items:flex-end;flex-wrap:wrap}
.ans{min-width:110px;height:clamp(58px,15vw,72px);border-radius:16px;background:#fff;border:3px solid #ddd5ff;font-size:clamp(34px,10vw,44px);font-weight:900;
  display:flex;align-items:center;justify-content:center;padding:0 12px;color:var(--ink)}
.ans.act{border-color:var(--pri);box-shadow:0 0 0 4px #e3dbff}
.ans.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.anslab{font-size:13px;font-weight:800;color:var(--muted);margin-bottom:3px;text-align:center}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;max-width:360px;margin:14px auto 0}
.pad button{height:clamp(54px,14vw,64px);border-radius:16px;background:#fff;box-shadow:var(--sh);font-size:30px;font-weight:900;color:var(--ink)}
.pad button:active{transform:scale(.94);background:#eee9ff}
.pad .go{background:var(--ok);color:#fff}
.pad .del{background:#ffe9e9;color:var(--bad)}
.fb{border-radius:var(--r);padding:14px;margin-top:12px;text-align:left}
.fb.good{background:var(--okl)}.fb.slow{background:var(--warnl)}.fb.bad{background:var(--badl)}
.fb .title{font-size:20px;font-weight:900;margin-bottom:6px}
/* strategies */
.strat{background:#faf8ff;border:2px solid #ebe5ff;border-radius:16px;padding:12px 14px;margin:10px 0}
.strat h4{margin:0 0 6px;font-size:18px}
.strat p{margin:4px 0;font-size:18px;line-height:1.45}
.strat b{color:var(--pri);font-size:20px}
.vis{margin-top:8px;overflow-x:auto}
.dots{display:inline-grid;gap:4px;padding:8px;background:#fff;border-radius:12px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--c1);display:inline-block}
.dot.b{background:var(--c2)}.dot.f{background:var(--c3)}.dot.x{background:var(--c3);opacity:.45;position:relative}
.dot.x::after{content:"";position:absolute;left:-2px;right:-2px;top:6px;height:2px;background:var(--bad);transform:rotate(-35deg)}
.frames{display:flex;gap:12px;flex-wrap:wrap}
.frame{display:grid;grid-template-columns:repeat(5,26px);grid-template-rows:repeat(2,26px);gap:3px;padding:5px;background:#333a5c;border-radius:8px}
.frame span{background:#fff;border-radius:4px;display:flex;align-items:center;justify-content:center}
.frame span i{width:18px;height:18px;border-radius:50%;background:var(--c1);display:block}
.frame span i.b{background:var(--c2)}
.groups{display:flex;flex-wrap:wrap;gap:8px}
.grp{border:2px dashed var(--pri2);border-radius:14px;padding:6px;display:flex;flex-wrap:wrap;gap:3px;max-width:96px;align-content:flex-start}
.grp.rest{border-color:var(--c2);background:#fff3ea}
.grp .lbl{width:100%;font-size:12px;font-weight:800;color:var(--c2)}
.tbl-chips{display:flex;flex-wrap:wrap;gap:6px}
.tbl-chips span{padding:6px 10px;border-radius:10px;background:#eee;font-weight:800}
.tbl-chips span.y{background:var(--okl);color:var(--ok)}
.tbl-chips span.hit{background:var(--ok);color:#fff}
.tbl-chips span.n{background:var(--badl);color:var(--bad);text-decoration:line-through}
.fam{display:grid;grid-template-columns:1fr 1fr;gap:6px;max-width:300px}
.fam span{background:#fff;border-radius:10px;padding:6px 10px;font-weight:800;text-align:center;border:2px solid #e5dfff}
svg text{font-family:inherit}
/* heat */
.heat{border-collapse:separate;border-spacing:2px;margin:0 auto}
.heat td,.heat th{width:30px;height:30px;text-align:center;font-size:11px;font-weight:800;border-radius:6px}
.heat th{color:var(--muted)}
.heat td{cursor:pointer}
.s0{background:#ece9f5;color:#aaa}.s1{background:var(--bad);color:#fff}.s2{background:var(--warn);color:#fff}
.s3{background:#bfe8c9;color:#1c6b3d}.s4{background:var(--ok);color:#fff}.s5{background:#0d6b3c;color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:8px;font-size:13px;margin:10px 0}
.legend span{display:flex;align-items:center;gap:4px}
.legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
.list{display:flex;flex-direction:column;gap:6px}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#faf8ff;border-radius:12px;padding:12px;font-weight:800;cursor:pointer}
.tag{font-size:13px;padding:3px 8px;border-radius:8px;white-space:nowrap}
.tag.bad{background:var(--badl);color:var(--bad)}.tag.slow{background:var(--warnl);color:#a35f00}.tag.ok{background:var(--okl);color:var(--ok)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.stats div{background:#faf8ff;border-radius:14px;padding:10px 4px;font-size:14px}
.stats b{display:block;font-size:28px}
.badges{display:flex;flex-wrap:wrap;gap:8px}
.badge{background:#fff7d6;border:2px solid #ffd75e;border-radius:12px;padding:6px 10px;font-weight:800;font-size:14px}
.badge.off{background:#f1f0f5;border-color:#e0dde9;color:#b3afc5}
.coll{display:grid;grid-template-columns:repeat(auto-fill,minmax(56px,1fr));gap:8px}
.coll div{aspect-ratio:1;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:32px;background:#f1f0f5;position:relative}
.coll div.lock{filter:grayscale(1);opacity:.25}
.coll div.r1{background:#e3f0ff}.coll div.r2{background:#f3e3ff}.coll div.r3{background:#fff2c2;box-shadow:0 0 0 2px var(--gold)}
.coll div sup{position:absolute;right:4px;top:2px;font-size:11px;font-weight:900;color:var(--muted)}
.cups{display:flex;gap:16px;justify-content:center;font-size:20px;font-weight:900}
.cups span{display:flex;flex-direction:column;align-items:center}
.cups span i{font-style:normal;font-size:40px}
/* reward */
.reward{text-align:center;padding:10px 0}
.cupbig{font-size:84px;animation:pop .6s}
@keyframes pop{0%{transform:scale(.2)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.chest{font-size:90px;cursor:pointer;display:inline-block;animation:wiggle 1.2s infinite}
@keyframes wiggle{0%,100%{transform:rotate(0)}10%{transform:rotate(-12deg)}20%{transform:rotate(12deg)}30%{transform:rotate(-8deg)}40%{transform:rotate(0)}}
.creature{font-size:96px;animation:pop .7s;display:inline-block}
.glow3{filter:drop-shadow(0 0 18px var(--gold))}.glow2{filter:drop-shadow(0 0 14px #b67cff)}
.rar{display:inline-block;border-radius:10px;padding:3px 10px;font-weight:900;font-size:14px;background:#eee}
.rar.r1{background:#dbeaff;color:#2958c7}.rar.r2{background:#efdcff;color:#7a2fc4}.rar.r3{background:var(--gold);color:#5a3b00}
/* break */
.timer{width:150px;height:150px;border-radius:50%;margin:16px auto;display:flex;align-items:center;justify-content:center;font-size:46px;font-weight:900;
  background:conic-gradient(var(--ok) var(--p,100%),#e2dcfb 0)}
.timer span{width:118px;height:118px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
.modal{position:fixed;inset:0;background:rgba(30,20,70,.45);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.modal .sheet{background:#fff;width:100%;max-width:760px;max-height:88vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px;padding-bottom:max(18px,env(safe-area-inset-bottom))}
input[type=text],input[type=number]{font-family:inherit;font-size:20px;padding:12px;border-radius:12px;border:2px solid #ddd5ff;width:100%}
.num-in{display:flex;align-items:center;gap:6px}
.num-in input{width:80px;text-align:center;font-weight:900;font-size:26px;padding:8px}
.num-in button{width:44px;height:44px;border-radius:12px;background:#eee9ff;color:var(--pri);font-size:24px;font-weight:900}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2350;color:#fff;padding:12px 18px;border-radius:14px;font-weight:800;z-index:30;display:none;max-width:90%;text-align:center}
.burst{position:fixed;pointer-events:none;font-size:28px;z-index:25;animation:fly 1s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(260deg);opacity:0}}
.hidden{display:none!important}
label.ck{display:flex;align-items:center;gap:10px;font-weight:700;padding:7px 0}
label.ck input{width:24px;height:24px;flex:none}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.langs{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.langs button{background:#fff;border-radius:18px;box-shadow:var(--sh);padding:16px 22px;font-size:20px;font-weight:900;color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:6px;border:3px solid transparent}
.langs button.on{border-color:var(--pri)}
.langs button span{font-size:48px}
.buddies{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.buddies button{font-size:38px;background:#fff;border-radius:16px;box-shadow:var(--sh);aspect-ratio:1;border:3px solid transparent}
.buddies button.on{border-color:var(--pri);background:#efe9ff}
.center{text-align:center}
/* lumi */
.qtext.wq{font-size:inherit;letter-spacing:0;margin:2px 0 6px}
.qprompt{font-size:21px;font-weight:800;margin:4px 0 10px;line-height:1.35}
.qvis{display:flex;justify-content:center;margin-bottom:6px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:420px}
.opt{background:#fff;border:3px solid #ddd5ff;border-radius:16px;padding:10px 6px;font-size:19px;font-weight:800;color:var(--ink);min-height:62px;display:flex;align-items:center;justify-content:center;text-align:center}
.opt:active{transform:scale(.96)}
.opt.ok{border-color:var(--ok);background:var(--okl)}.opt.bad{border-color:var(--bad);background:var(--badl)}.opt.dis{opacity:.3;pointer-events:none}
.unit{font-size:26px;font-weight:900;color:var(--muted);align-self:center}
.hero.w2{background:linear-gradient(135deg,#0f97ad,#1fa463)}
.newtag{white-space:nowrap;display:inline-block;background:var(--gold);color:#5a3b00;border-radius:8px;padding:2px 8px;font-size:13px;font-weight:900;margin-left:6px}
.wbar{height:8px;background:#e2dcfb;border-radius:6px;overflow:hidden;margin-top:6px;width:100%}.wbar>div{height:100%;background:var(--ok)}
.lvbtn{display:flex;flex-direction:column;align-items:flex-start;width:100%;text-align:left;background:#faf8ff;border-radius:14px;padding:14px;font-size:18px;font-weight:800;color:var(--ink);margin-bottom:8px;border:2px solid #ebe5ff}
.lvbtn small{font-weight:600;color:var(--muted);font-size:14px}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<header>
  <h1 onclick="go('home')" id="hdrTitle">🦉 Mate-Magie</h1>
  <span class="pill" id="hdrStars">⭐ 0</span>
  <button class="lang-btn" onclick="toggleLang()" id="hdrLang">DA</button>
</header>

<div id="testBanner" class="hidden" style="background:#ffd75e;color:#5a3b00;font-weight:800;text-align:center;padding:8px;font-size:14px"></div>
<main>
<!-- ONBOARDING -->
<section class="screen" id="onboard">
  <div class="card center" id="ob1">
    <h2>🌍 Alege limba · Vælg sprog</h2>
    <div class="langs">
      <button onclick="setLang('ro');obStep(2)"><span>🇷🇴</span>Română</button>
      <button onclick="setLang('da');obStep(2)"><span>🇩🇰</span>Dansk</button>
    </div>
  </div>
  <div class="card hidden" id="ob2">
    <div class="buddy"><div class="av">🦉</div><div class="bubble" data-t="obName"></div></div>
    <input type="text" id="nameIn" autocomplete="off" autocapitalize="words" maxlength="20">
    <div class="row" style="margin-top:12px"><button class="btn" onclick="obName()" data-t="next"></button></div>
  </div>
  <div class="card hidden" id="ob3">
    <div class="buddy"><div class="av" id="obAv">🦉</div><div class="bubble" id="obBuddyTxt"></div></div>
    <div class="buddies" id="buddyList"></div>
    <div class="row" style="margin-top:14px"><button class="btn ok" onclick="obDone()" data-t="letsGo"></button></div>
  </div>
</section>

<!-- HOME -->
<section class="screen" id="home">
  <div class="buddy"><div class="av" id="homeAv" onclick="buddyTalk()">🦊</div><div class="bubble" id="homeMsg"></div></div>
  <div class="stat-row" id="homeStats"></div>
  <button class="big-btn hero" id="bMission" onclick="go('missionSetup')"><span class="ico">🚀</span><span data-t="btnMission"></span><small data-t="btnMissionSub"></small></button>
  <button class="big-btn hero w2" onclick="go('worlds')"><span class="ico">🗺️</span><span><span id="bWorldsT"></span><span id="bWorldsNew"></span></span><small id="bWorldsS"></small></button>
  <div class="grid2">
    <button class="big-btn" id="bAssess" onclick="go('assessSetup')"><span class="ico">🔍</span><span data-t="btnAssess"></span><small data-t="btnAssessSub"></small></button>
    <button class="big-btn" onclick="openRoom()"><span class="ico">🏆</span><span data-t="btnRoom"></span><small data-t="btnRoomSub"></small></button>
    <button class="big-btn" onclick="openExplore()"><span class="ico">💡</span><span data-t="btnTricks"></span><small data-t="btnTricksSub"></small></button>
    <button class="big-btn" onclick="openParent()"><span class="ico">📊</span><span data-t="btnParent"></span><small data-t="btnParentSub"></small></button>
  </div>
</section>

<!-- MISSION SETUP -->
<section class="screen" id="missionSetup">
  <div class="card">
    <h2 data-t="chooseMission"></h2>
    <div class="list" id="missionList"></div>
    <p class="muted" data-t="missionNote"></p>
    <button class="btn sec" onclick="go('home')" data-t="back"></button>
  </div>
</section>

<!-- ASSESS SETUP -->
<section class="screen" id="assessSetup">
  <div class="card">
    <h2>🔍 <span data-t="btnAssess"></span></h2>
    <p data-t="assessIntro"></p>
    <div class="list" id="assessList"></div>
    <div class="row" style="margin-top:12px"><button class="btn sec" onclick="go('home')" data-t="back"></button></div>
  </div>
</section>

<!-- QUIZ -->
<section class="screen" id="quiz">
  <div class="card qbox">
    <div class="qtop">
      <button class="iconbtn" onclick="quitSession()" aria-label="stop">✖</button>
      <div class="path" id="qPath"></div>
      <span class="combo" id="qCombo"></span>
      <button class="iconbtn" id="spkBtn" onclick="toggleSpeak()" aria-label="read">🔇</button>
    </div>
    <div class="qbuddy"><span class="av" id="qAv">🦊</span><div class="bubble" id="qBubble"></div></div>
    <div id="qBonus"></div>
    <div class="qtext" id="qText" onclick="speakQ()" style="cursor:pointer"></div>
    <div class="answers" id="ansWrap"></div>
    <div class="pad" id="pad"></div>
    <div class="row" style="justify-content:center;margin-top:10px" id="hintRow"><button class="btn sec sm" onclick="showHint()" data-t="hint"></button></div>
    <div id="fb"></div>
  </div>
</section>

<!-- LUMI -->
<section class="screen" id="worlds"><div class="card"><h2>🗺️ <span id="wTitle"></span></h2><div class="list" id="worldList"></div><div class="row" style="margin-top:12px"><button class="btn sec" onclick="go('home')" data-t="back"></button></div></div></section>
<section class="screen" id="world"><div class="card" id="worldBox"></div></section>
<section class="screen" id="disc"><div class="card" id="discBox"></div></section>

<!-- BREAK -->
<section class="screen" id="brk">
  <div class="card center">
    <h2 data-t="breakTitle"></h2>
    <p class="muted" data-t="breakSub"></p>
    <div style="font-size:70px" id="brkEmoji"></div>
    <p style="font-size:22px;font-weight:800" id="brkTxt"></p>
    <div class="timer" id="brkTimer"><span id="brkSec">20</span></div>
    <button class="btn ok" onclick="endBreak()" data-t="breakDone"></button>
  </div>
</section>

<!-- RESULTS -->
<section class="screen" id="results"><div class="card" id="resBox"></div></section>

<!-- ROOM -->
<section class="screen" id="room">
  <div class="card"><h2>🏆 <span data-t="btnRoom"></span></h2><div class="cups" id="roomCups"></div></div>
  <div class="card"><h3 id="collTitle"></h3><div class="coll" id="roomColl"></div></div>
  <div class="card"><h3 data-t="achievements"></h3><div class="badges" id="roomAch"></div></div>
</section>

<!-- EXPLORE -->
<section class="screen" id="explore">
  <div class="card">
    <h2>💡 <span data-t="exTitle"></span></h2>
    <p class="muted" data-t="exIntro"></p>
    <div class="chips" id="exOps"></div>
    <div class="row" style="margin:14px 0;justify-content:center">
      <div class="num-in"><button onclick="exStep('A',-1)">−</button><input type="number" inputmode="numeric" id="exA" value="7" min="0" max="100"><button onclick="exStep('A',1)">+</button></div>
      <span style="font-size:30px;font-weight:900" id="exSign">×</span>
      <div class="num-in"><button onclick="exStep('B',-1)">−</button><input type="number" inputmode="numeric" id="exB" value="8" min="0" max="100"><button onclick="exStep('B',1)">+</button></div>
    </div>
    <div class="row" style="justify-content:center"><button class="btn" onclick="renderExplore()" data-t="exShow"></button><button class="btn sec" onclick="exRandom()" data-t="exOther"></button></div>
  </div>
  <div id="exOut"></div>
</section>

<!-- PARENT -->
<section class="screen" id="parent">
  <div class="card">
    <h2>📊 <span data-t="pTitle"></span></h2>
    <div class="tabs" id="pTabs"></div>
    <div id="pOut"></div>
    <div class="legend" id="legend"></div>
    <p class="muted" style="font-size:14px" data-t="tapCell"></p>
  </div>
  <div class="card"><h3>🗓️ <span data-t="history"></span></h3><div id="hist"></div></div>
  <div class="card">
    <h3>⚙️ <span data-t="settings"></span></h3>
    <p style="margin:6px 0"><b data-t="language"></b></p>
    <div class="chips" id="langChips"></div>
    <p style="margin:12px 0 4px"><b data-t="childName"></b></p>
    <input type="text" id="setName" maxlength="20">
    <p style="margin:12px 0 4px"><b data-t="thrTitle"></b></p>
    <p class="muted" style="margin:0 0 6px;font-size:14px" data-t="thrNote"></p>
    <div class="chips" id="slowChips"></div>
    <p style="margin:12px 0 4px"><b data-t="lenTitle"></b></p>
    <div class="chips" id="lenChips"></div>
    <div style="margin-top:8px">
      <label class="ck"><input type="checkbox" id="ckSound"><span data-t="sound"></span></label>
      <label class="ck"><input type="checkbox" id="ckVib"><span data-t="vib"></span></label>
      <label class="ck"><input type="checkbox" id="ckSpeak"><span data-t="speak"></span></label>
      <div class="row" style="margin:2px 0 8px 34px"><button class="btn sec sm" onclick="testVoice()" data-t="testVoice"></button></div>
      <p id="ttsInfo" class="muted" style="font-size:14px;margin:0 0 8px"></p>
      <label class="ck"><input type="checkbox" id="ckBreaks"><span data-t="breaks"></span></label>
      <label class="ck"><input type="checkbox" id="ckBig"><span data-t="big"></span></label>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm" onclick="saveSettings()" data-t="save"></button>
      <button class="btn sec sm" onclick="exportData()" data-t="export"></button>
      <button class="btn sec sm" onclick="document.getElementById('impFile').click()" data-t="import"></button>
      <input type="file" id="impFile" accept=".json,application/json" class="hidden" onchange="importData(this)">
      <button class="btn sec sm" style="color:var(--bad)" onclick="resetAll()" data-t="reset"></button>
    </div>
    <p class="muted" style="font-size:13px" data-t="storeNote"></p>
    <div id="exportRemind"></div>
    <h3 style="margin-top:14px">🛟 <span data-t="bkTitle"></span></h3>
    <div class="list" id="bkList"></div>
  </div>
  <div class="card"><h3>🧠 <span data-t="adhdTitle"></span></h3><div data-t="adhdNote" style="font-size:15px;line-height:1.5"></div></div>
</section>
</main>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><div class="sheet"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><h3 id="mTitle"></h3><button class="btn sec sm" onclick="closeModal()">✖</button></div><div id="mBody"></div></div></div>

/* ================= FACTS ================= */
function poolOf(op){
  const k=[];
  if(op==='add')for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)k.push(`add|${a}|${b}`);
  if(op==='sub')for(let b=1;b<=10;b++)for(let d=1;d<=10;d++)k.push(`sub|${b+d}|${b}`);
  if(op==='mul')for(let a=1;a<=10;a++)for(let b=1;b<=10;b++)k.push(`mul|${a}|${b}`);
  if(op==='div')for(let b=1;b<=10;b++)for(let q=1;q<=10;q++)k.push(`div|${b*q}|${b}`);
  if(op==='rem')for(let b=2;b<=9;b++)for(let q=1;q<=9;q++)for(let r=1;r<b;r++)k.push(`rem|${b*q+r}|${b}`);
  return k;
}
function bigKey(){
  if(Math.random()<.5){const a=10+rnd(80),b=10+rnd(Math.max(1,90-a));return `add|${a}|${Math.max(1,Math.min(b,99-a))}`;}
  const c=20+rnd(80),b=10+rnd(c-10);return `sub|${c}|${b}`;
}
function makeQ(key){
  if(key.startsWith('w|'))return worldQ(key);
  const [op,x,y]=key.split('|');const a=+x,b=+y;const q={key,op,a,b};
  if(op==='add'){q.sign='+';q.ans=a+b;}
  if(op==='sub'){q.sign='−';q.ans=a-b;}
  if(op==='mul'){q.sign=X();q.ans=a*b;}
  if(op==='div'){q.sign=':';q.ans=a/b;}
  if(op==='rem'){q.sign=':';q.ans=Math.floor(a/b);q.rest=a%b;}
  q.text=`${a} ${q.sign} ${b}`;
  q.big=(op==='add'||op==='sub')&&(a>20||b>10);
  return q;
}
function ansText(q){if(q.w)return q.kind==='mc'?q.ansText:`${q.ans}${q.unit?' '+q.unit:''}`;return q.op==='rem'?`${q.ans} ${st('restWord')} ${q.rest}`:q.ans;}
function thr(q){if(q.w)return q.ahead?1e9:S.settings.slow*3;return S.settings.slow*((q.op==='rem'||q.big)?2:1);}
const rec=k=>S.facts[k];
function weakness(k){
  const f=rec(k);if(!f)return null;
  let w=(5-f.box)*2+(f.lastSlow?3:0)+(f.lastWrong?4:0);
  w+=Math.min((Date.now()-f.last)/864e5*0.7*(f.box+1),6); // faptele știute revin după câteva zile
  return w+Math.random();
}
function status(k){const f=rec(k);if(!f)return 0;if(f.lastWrong)return 1;if(f.lastSlow||f.box<=1)return 2;if(f.box===2)return 3;if(f.box>=5)return 5;return 4;}
function record(q,ok,tm,assess){
  if(ok)S.correct++;
  if(q.big){const k=`big|${q.op}`;const f=S.facts[k]||(S.facts[k]={n:0,ok:0,ema:null});f.n++;if(ok){f.ok++;f.ema=f.ema==null?tm:f.ema*.7+tm*.3;}return ok&&tm<=thr(q);}
  const f=S.facts[q.fk||q.key]||(S.facts[q.fk||q.key]={n:0,ok:0,ema:null,box:0,last:0,slowN:0,wrongN:0});
  const fast=ok&&tm<=thr(q);
  f.n++;f.last=Date.now();f.lastT=tm;
  if(ok){f.ok++;f.ema=f.ema==null?tm:f.ema*.6+tm*.4;}
  f.lastWrong=!ok;f.lastSlow=ok&&!fast;
  if(!ok){f.wrongN++;f.box=0;}
  else if(!fast){f.slowN++;f.box=Math.max(1,Math.min(f.box,2));}
  else f.box=assess?Math.max(f.box+1,3):Math.min(5,f.box+1);
  return fast;
}

/* ================= SESSION BUILDER ================= */
function buildSession(pool,len,forced){
  const seen=pool.filter(rec),unseen=shuffle(pool.filter(k=>!rec(k)));
  const nF=len>=20?4:len>=10?3:2;
  const byWeak=arr=>arr.map(k=>[k,weakness(k)]).sort((a,b)=>b[1]-a[1]).map(x=>x[0]);
  let focus=[];
  if(forced&&forced.length)focus=forced.slice(0,nF);
  else{
    focus=byWeak(seen.filter(k=>rec(k).box<3)).slice(0,nF);
    while(focus.length<nF&&unseen.length)focus.push(unseen.pop());
    if(focus.length<nF)focus.push(...byWeak(seen.filter(k=>!focus.includes(k))).slice(0,nF-focus.length));
  }
  const reps=len>=10?3:2,nR=Math.max(0,len-focus.length*reps);
  let review=shuffle(byWeak(seen.filter(k=>!focus.includes(k))).slice(0,nR*2)).slice(0,nR);
  while(review.length<nR&&unseen.length)review.push(unseen.pop());
  if(S.settings.big&&pool.some(k=>k.startsWith('add')||k.startsWith('sub')))for(let i=0;i<review.length;i++)if(Math.random()<.3)review[i]=bigKey();
  const fq=[];for(let r=0;r<reps;r++)fq.push(...focus);
  const out=[];let ri=0,fi=0;
  while(fi<fq.length||ri<review.length){
    if(fi<fq.length)out.push(fq[fi++]);
    if(ri<review.length&&(out.length%3===2||fi>=fq.length))out.push(review[ri++]);
  }
  while(out.length<len&&pool.length)out.push(pick(pool));
  return out.slice(0,len);
}
const MISSION_OPS={mix:OPS,mul:['mul'],div:['div'],addsub:['add','sub'],rem:['rem']};
function poolFor(m){let p=[];(MISSION_OPS[m]||OPS).forEach(op=>p=p.concat(poolOf(op)));return p;}

/* ================= QUIZ ENGINE ================= */
let sess=null,cur=null,idleT=null;
function startMission(type,forced){
  const pool=forced?[...new Set(forced.concat(poolFor('mix')))]:poolFor(type);
  const len=S.settings.len;
  sess={mode:'practice',type,queue:buildSession(pool,len,forced),i:0,res:[],stars:0,combo:0,maxC:0,len,
        bonusIdx:2+rnd(Math.max(1,len-3)),halfDone:false,breakDone:false};
  startQuiz();
}
function startAssess(kind){
  let keys=[];
  const two=(lo,hi)=>{const o=[];for(let a=lo;a<=hi;a++)for(let b=a;b<=hi;b++)o.push(Math.random()<.5?[a,b]:[b,a]);return o;};
  if(kind==='mul')keys=two(2,9).map(([a,b])=>`mul|${a}|${b}`);
  if(kind==='div')keys=shuffle(two(2,9)).slice(0,24).map(([b,q])=>`div|${b*q}|${b}`);
  if(kind==='add')keys=shuffle(two(2,9)).slice(0,24).map(([a,b])=>`add|${a}|${b}`);
  if(kind==='sub')keys=shuffle(two(2,9)).slice(0,24).map(([b,d])=>`sub|${b+d}|${b}`);
  if(kind==='rem')keys=shuffle(poolOf('rem')).slice(0,12);
  if(kind==='mix')OPS.forEach(op=>{keys=keys.concat(shuffle(poolOf(op).filter(k=>{const q=makeQ(k);return q.a!==1&&q.b!==1&&q.b!==10;})).slice(0,6));});
  sess={mode:'assess',kind,queue:shuffle(keys),i:0,res:[],stars:0,combo:0,maxC:0,bonusIdx:-1,halfDone:true,breakDone:true};
  startQuiz();
}
function startQuiz(){document.body.classList.add('focus');updSpk();$('qAv').textContent=S.buddy;go('quiz');showQ();}
function showQ(){
  if(sess.i>=sess.queue.length)return endSession();
  // pauză de mișcare la jumătatea misiunilor lungi
  if(sess.mode==='practice'&&!sess.breakDone&&sess.len>=15&&sess.i===Math.floor(sess.len/2)&&S.settings.breaks){sess.breakDone=true;return startBreak(()=>{go('quiz');showQ();});}
  cur=makeQ(sess.queue[sess.i]);cur.choice=null;cur.dis=[];cur.vals=['',''];cur.field=0;cur.hint=false;cur.done=false;cur.retried=false;cur.idleShown=false;
  cur.bonus=sess.i===sess.bonusIdx;
  renderPath();
  $('qBonus').innerHTML=cur.bonus?`<span class="bonus">${t('bonusQ')}</span>`:'';
  $('qText').classList.toggle('wq',!!cur.w);
  $('qText').innerHTML=cur.w?`<div class="qprompt">${cur.prompt}</div>${cur.vis?`<div class="qvis">${cur.vis}</div>`:''}`:`${cur.text} <span class="eq">=</span>`;
  $('fb').innerHTML='';$('pad').classList.toggle('hidden',cur.kind==='mc');
  $('hintRow').classList.toggle('hidden',sess.mode==='assess');
  $('qCombo').textContent=sess.combo>=2?`🔥${sess.combo}`:'';
  renderAns();buildPad();
  const left=sess.queue.length-sess.i;
  if(sess.mode==='practice'&&left===2)say(msg('near',{k:2}));
  else if(sess.mode==='practice'&&!sess.halfDone&&sess.i===Math.floor(sess.queue.length/2)){sess.halfDone=true;say(msg('half'));}
  else hideSay();
  if(cur.ahead&&sess.i===0)say(WD().ahead,7000);
  cur.t0=performance.now();cur.lastAct=cur.t0;
  if(S.settings.speak)speakQ();
  clearInterval(idleT);idleT=setInterval(checkIdle,1000);
}
function renderPath(){
  const n=sess.queue.length;let h='';
  if(n<=24)for(let i=0;i<n;i++)h+=`<i class="${i<sess.i?'d':i===sess.i?'now':''}"></i>`;
  else h=`<div class="progress" style="flex:1;height:10px;background:#e2dcfb;border-radius:9px;overflow:hidden"><div style="height:100%;width:${sess.i/n*100}%;background:var(--pri2)"></div></div>`;
  $('qPath').innerHTML=h+(sess.mode==='practice'?'<b>🎁</b>':'<b>🏁</b>');
}
function say(m,ms){const b=$('qBubble');b.textContent=m;b.classList.add('on');clearTimeout(b._t);if(ms)b._t=setTimeout(hideSay,ms);}
function hideSay(){$('qBubble').classList.remove('on');}
function checkIdle(){
  if(!cur||cur.done||!$('quiz').classList.contains('on')){return;}
  if(!cur.idleShown&&performance.now()-cur.lastAct>25000){cur.idleShown=true;say(msg('idle',{k:sess.queue.length-sess.i}));sound('ok');buzz(40);}
}
function renderAns(){
  const w=$('ansWrap');
  if(cur.kind==='mc'){w.innerHTML=`<div class="opts">${cur.opts.map((o,i)=>`<button class="opt ${cur.dis.includes(i)?'dis':''} ${cur.done&&i===cur.correct?'ok':''} ${cur.done&&i===cur.choice&&i!==cur.correct?'bad':''}" onclick="pickOpt(${i})">${o}</button>`).join('')}</div>`;return;}
  if(cur.w){w.innerHTML=`<div class="ans act">${cur.vals[0]||'&nbsp;'}</div>${cur.unit?`<span class="unit">${cur.unit}</span>`:''}`;return;}
  if(cur.op==='rem')w.innerHTML=`<div><div class="anslab">${t('quot')}</div><div class="ans ${cur.field===0?'act':''}" onclick="setField(0)">${cur.vals[0]||'&nbsp;'}</div></div>
      <div><div class="anslab">${t('rest')}</div><div class="ans ${cur.field===1?'act':''}" onclick="setField(1)">${cur.vals[1]||'&nbsp;'}</div></div>`;
  else w.innerHTML=`<div class="ans act">${cur.vals[0]||'&nbsp;'}</div>`;
}
function pickOpt(i){if(!cur||cur.done||cur.dis.includes(i))return;cur.lastAct=performance.now();cur.choice=i;submit();}
function setField(i){if(cur.done)return;cur.field=i;renderAns();}
function buildPad(){
  $('pad').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key('${n}')">${n}</button>`).join('')+
   `<button class="del" onclick="key('del')">⌫</button><button onclick="key('0')">0</button><button class="go" onclick="key('ok')">✔</button>`;
}
function key(k){
  if(!cur||cur.done)return;
  cur.lastAct=performance.now();
  if(cur.kind==='mc'){if(/^[1-9]$/.test(k)&&+k<=cur.opts.length)pickOpt(+k-1);return;}
  const f=cur.field;
  if(k==='del')cur.vals[f]=cur.vals[f].slice(0,-1);
  else if(k==='ok'){if(cur.op==='rem'&&f===0&&cur.vals[0]!==''&&cur.vals[1]===''){cur.field=1;renderAns();return;}return submit();}
  else if(k==='next'){if(cur.op==='rem'){cur.field=1-cur.field;renderAns();}return;}
  else if(cur.vals[f].length<3)cur.vals[f]+=k;
  renderAns();
}
document.addEventListener('keydown',e=>{
  if(!$('quiz').classList.contains('on'))return;
  if(cur&&cur.done){if(e.key==='Enter'||e.key===' '){e.preventDefault();nextQ();}return;}
  if(/^[0-9]$/.test(e.key))key(e.key);
  else if(e.key==='Backspace')key('del');
  else if(e.key==='Enter')key('ok');
  else if(e.key==='Tab'||e.key===' '){e.preventDefault();key('next');}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur&&!cur.done){cur.t0=performance.now();cur.lastAct=cur.t0;}});
function submit(){
  if(cur.kind==='mc'){if(cur.choice==null)return;}
  else if(cur.vals[0]===''||(cur.op==='rem'&&cur.vals[1]===''))return;
  const tm=(performance.now()-cur.t0)/1000;
  const ok=cur.kind==='mc'?cur.choice===cur.correct:cur.op==='rem'?(+cur.vals[0]===cur.ans&&+cur.vals[1]===cur.rest):(+cur.vals[0]===cur.ans);
  // „Stop și gândește": greșeală foarte rapidă → încă o șansă
  if(!ok&&tm<1.6&&!cur.retried&&sess.mode==='practice'){
    cur.retried=true;cur.vals=['',''];cur.field=0;if(cur.kind==='mc'){cur.dis.push(cur.choice);cur.choice=null;}renderAns();
    document.querySelectorAll('.ans').forEach(a=>{a.classList.add('shake');setTimeout(()=>a.classList.remove('shake'),450);});
    say(msg('impulsive'),2600);buzz(30);return;
  }
  const tt=(cur.hint||cur.retried)?Math.max(tm,thr(cur)+.1):tm;
  const fast=record(cur,ok,tt,sess.mode==='assess');
  cur.done=true;clearInterval(idleT);stopSpeak();if(cur.kind==='mc')renderAns();
  sess.res.push({key:cur.key,ok,t:tt,fast,big:cur.big});
  let stars=ok?(fast?2:1):0;if(cur.bonus)stars*=2;
  if(ok){sess.combo++;sess.maxC=Math.max(sess.maxC,sess.combo);S.maxCombo=Math.max(S.maxCombo||0,sess.combo);}else sess.combo=0;
  let comboMsg='';
  if(ok&&sess.combo>=5&&sess.combo%5===0){stars+=3;comboMsg=msg('combo',{k:sess.combo});}
  sess.stars+=stars;S.stars+=stars;
  $('qCombo').textContent=sess.combo>=2?`🔥${sess.combo}`:'';
  save();updateHeader();checkAch();
  if(ok){sound(fast?'great':'ok');buzz(fast?25:15);if(fast)burst();}else{sound('bad');buzz([50,40,50]);}
  if(comboMsg)say(comboMsg,2500);
  if(sess.mode==='assess'){
    $('fb').innerHTML=ok?`<div class="fb good"><div class="title">✓</div></div>`:`<div class="fb bad"><div class="title">${cur.text} = ${ansText(cur)}</div></div>`;
    setTimeout(nextQ,ok?500:1500);return;
  }
  $('pad').classList.add('hidden');$('hintRow').classList.add('hidden');
  const strats=stratsFor(cur);const best=strats[0];
  if(ok&&fast){
    $('fb').innerHTML=`<div class="fb good"><div class="title">${msg('fast')} +${stars} ⭐</div></div>`;
    setTimeout(()=>{if(cur&&cur.done)nextQ();},comboMsg?1600:1000);return;
  }
  if(!ok){const pos=Math.min(sess.queue.length,sess.i+3);sess.queue.splice(pos,0,cur.key);} // revine peste 3 întrebări
  $('fb').innerHTML=`<div class="fb ${ok?'slow':'bad'}">
     <div class="title">${ok?msg('slow')+` +${stars} ⭐`:msg('wrong')}</div>
     ${ok?'':`<p style="font-size:22px;font-weight:900;margin:4px 0">${cur.w?`${WD().rightAns}: ${ansText(cur)}`:`${cur.text} = ${ansText(cur)}`}</p>`}
     <p style="margin:0 0 6px">${ok?t('slowIntro'):t('wrongIntro')}</p>
     ${best?stratHTML(best):''}
     <div class="row" style="margin-top:10px">
       <button class="btn ok" onclick="nextQ()">${t('cont')}</button>
       ${strats.length>1?`<button class="btn sec sm" onclick="showAllStrats('${cur.key}')">${strats.length===2?t('oneMore'):t('moreN',strats.length-1)}</button>`:''}
     </div></div>`;
}
function nextQ(){if(!sess)return;sess.i++;showQ();window.scrollTo(0,0);}
function showHint(){if(cur.done)return;cur.hint=true;cur.lastAct=performance.now();const s=stratsFor(cur)[0];if(s)say(`💡 ${s.t}: ${s.hint||strip(s.l[0])}`,6000);}
const strip=h=>String(h).replace(/<[^>]+>/g,'');

function todayStr(d=new Date()){return d.toISOString().slice(0,10);}
function streak(){const set=new Set(S.days);let n=0;const d=new Date();if(!set.has(todayStr(d)))d.setDate(d.getDate()-1);while(set.has(todayStr(d))){n++;d.setDate(d.getDate()-1);}return n;}
function rollCreature(boost){
  const w=boost?[45,35,15,5]:[60,28,10,2];let r=Math.random()*100,rar=0;
  for(let i=0;i<4;i++){if(r<w[i]){rar=i;break;}r-=w[i];}
  return pick(CREATURES.filter(c=>c[1]===rar));
}
let pendingChest=null;
function endSession(quit){

function stratHTML(s){return `<div class="strat"><h4>${s.e} ${s.t}</h4>${s.l.map(x=>`<p>${x}</p>`).join('')}${s.v?`<div class="vis">${s.v}</div>`:''}</div>`;}

/* vizualuri */
function dots(rows,cols,split,mode){
  if(rows<=0||cols<=0)return '';

  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){let cl='dot';if(split!=null&&c>=split)cl+=mode==='half'?' f':mode==='cross'?' x':' b';h+=`<span class="${cl}"></span>`;}
  return h+'</div>';
}
function tenFrames(big,sm){
  const need=Math.min(sm,10-big),rest=sm-need;

  const f1=[];for(let i=0;i<10;i++)f1.push(i<big?'a':i<big+need?'b':'');
  let h=`<div class="frames">${fr(f1)}`;

function groups(nG,per,rest){

}
function numberLine(start,jumps){
  const pts=[start];jumps.forEach(j=>pts.push(pts[pts.length-1]+j));
  let lo=Math.min(...pts),hi=Math.max(...pts);const pad=Math.max(1,Math.round((hi-lo)*.08));lo-=pad;hi+=pad;
  const W=600,Xp=v=>20+(v-lo)/(hi-lo)*(W-40),Y=80;
  let s=`<svg viewBox="0 0 ${W} 120" width="100%" style="max-width:600px;background:#fff;border-radius:12px"><line x1="10" y1="${Y}" x2="${W-10}" y2="${Y}" stroke="#2b2350" stroke-width="3"/>`;
  const step=hi-lo<=24?1:hi-lo<=60?5:10;
  for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){const major=v%10===0;
    s+=`<line x1="${Xp(v)}" y1="${Y-(major?9:5)}" x2="${Xp(v)}" y2="${Y+(major?9:5)}" stroke="#7a7399" stroke-width="${major?2.5:1.5}"/>`;
    if(step===1&&!pts.includes(v))s+=`<text x="${Xp(v)}" y="${Y+24}" font-size="12" fill="#b3afc5" text-anchor="middle">${v}</text>`;}
  jumps.forEach((d,i)=>{const x1=Xp(pts[i]),x2=Xp(pts[i+1]),mid=(x1+x2)/2,hg=Math.min(55,18+Math.abs(x2-x1)*.35),col=d>=0?'#1fa463':'#e5484d';
    s+=`<path d="M${x1} ${Y-4} Q ${mid} ${Y-hg*1.6} ${x2} ${Y-4}" fill="none" stroke="${col}" stroke-width="3"/>`;
    s+=`<polygon points="${x2},${Y-3} ${x2+(d>=0?-9:9)},${Y-12} ${x2+(d>=0?-2:2)},${Y-14}" fill="${col}"/>`;
    s+=`<text x="${mid}" y="${Y-hg*.8-6}" font-size="17" font-weight="800" fill="${col}" text-anchor="middle">${d>=0?'+':'−'}${Math.abs(d)}</text>`;});
  pts.forEach((p,i)=>{const last=i===pts.length-1;
    s+=`<circle cx="${Xp(p)}" cy="${Y}" r="${last?7:5}" fill="${last?'#5b3cc4':'#2b2350'}"/><text x="${Xp(p)}" y="${Y+28}" font-size="${last?20:16}" font-weight="900" fill="${last?'#5b3cc4':'#2b2350'}" text-anchor="middle">${p}</text>`;});
  return s+'</svg>';

function tableChips(b,n){let h='<div class="tbl-chips">';const q=Math.floor(n/b);
  for(let k=1;k<=Math.min(10,q+1);k++){const v=k*b;h+=`<span class="${v===q*b?'hit':v<=n?'y':'n'}">${k}${X()}${b}=${v}</span>`;}return h+'</div>';}
function family(q,b,n){const x=X();return `<div class="fam"><span>${q} ${x} ${b} = ${n}</span><span>${b} ${x} ${q} = ${n}</span><span>${n} : ${b} = ${q}</span><span>${n} : ${q} = ${b}</span></div>`;}
const seq=(step,cnt)=>Array.from({length:cnt},(_,i)=>(i+1)*step).join(', ');
/* înmulțire */
const RANK={0:0,1:0,10:1,2:2,5:3,4:4,3:5,9:6,8:7,6:8,7:9};
function mulRule(f,g,a,b){
  const P=a*b,x=X();
  switch(f){
    case 0:return {e:'🕳️',t:st('m0t'),l:[st('m0a'),`${a} ${x} ${b} = <b>0</b>`]};
    case 1:return {e:'☝️',t:st('m1t'),l:[st('m1a'),`${a} ${x} ${b} = <b>${P}</b>`]};
    case 2:return {e:'👯',t:st('m2t'),hint:st('m2h',g),l:[st('m2a',g),`${g} + ${g} = <b>${P}</b>`],v:dots(g,2,1)};
    case 10:return {e:'🔟',t:st('m10t'),hint:st('m10h'),l:[st('m10a'),`${g} → <b>${P}</b>`],v:dots(g,10)};
    case 5:return {e:'✋',t:st('m5t'),hint:st('m5h',g),l:[st('m5a',g,g*10),st('m5b',g*10,P)],v:dots(g,10,5,'half')};
    case 4:return {e:'🔁',t:st('m4t'),hint:st('m4h',g),l:[st('m4a'),`${g} ${x} 2 = ${g*2}`,`${g*2} ${x} 2 = <b>${P}</b>`],v:dots(g,4,2)};
    case 8:return {e:'🚀',t:st('m8t'),hint:st('m8h',g),l:[st('m8a'),`${g} → ${g*2} → ${g*4} → <b>${P}</b>`],v:dots(g,8,4)};
    case 9:return {e:'🎯',t:st('m9t'),hint:st('m9h',g),l:[`${g} ${x} 10 = ${g*10}`,st('m9b',g,g*10,P)],v:dots(g,10,9,'cross')};
    case 3:return {e:'➕',t:st('m3t'),hint:st('m3h',g),l:[`${g} ${x} 2 = ${g*2}`,`${g*2} + ${g} = <b>${P}</b>`],v:dots(g,3,2)};
    case 6:return {e:'🖐️',t:st('m6t'),hint:st('m6h',g),l:[`${g} ${x} 5 = ${g*5}`,`${g*5} + ${g} = <b>${P}</b>`],v:dots(g,6,5)};
    case 7:return {e:'🧩',t:st('m7t'),hint:st('m7h',g),l:[st('m7a'),`${g} ${x} 5 = ${g*5}`,`${g} ${x} 2 = ${g*2}`,`${g*5} + ${g*2} = <b>${P}</b>`],v:dots(g,7,5)};
  }

}
function mulStrats(a,b){
  const out=[],P=a*b;
  const fs=a===b?[a]:[a,b].sort((p,q)=>(RANK[p]??9)-(RANK[q]??9));
  fs.forEach((f,i)=>{const g=f===a?b:a;const r=mulRule(f,g,a,b);if(!r)return;
    if(i===0&&f===a&&a!==b&&a>1)r.l.unshift(st('swap',a,b));out.push(r);});
  if(Math.abs(a-b)===1&&Math.min(a,b)>=3){const m=Math.min(a,b),M=Math.max(a,b);
    out.push({e:'🟪',t:st('sqT'),hint:st('sqH',m),l:[st('sqA',m,m*m),st('sqB',M,m,m*m,P)],v:dots(m,M,m)});}
  if(a>0&&b>0&&a<=10&&b<=10)out.push({e:'🟣',t:st('grT'),hint:st('grH',b),l:[st('grA',a,b),st('grB',b,seq(b,a),P)],v:dots(a,b)});
  return out.slice(0,5);
}
/* împărțire */
function divStrats(n,b){
  if(b===0)return [{e:'🚫',t:st('dNo'),l:[st('d0')]}];
  if(n===0)return [{e:'🕳️',t:st('dzT'),l:[st('dz')]}];

  out.push({e:'🔄',t:st('dmT'),hint:st('dmH',b,n),l:[st('dmA',b,n),st('dmB',q,b,n),st('dmC',n,b,q)],v:family(q,b,n)});
  if(b===2)out.push({e:'✂️',t:st('d2t'),hint:st('d2h'),l:[st('d2a'),st('d2b',n,q)]});
  if(b===4)out.push({e:'✂️',t:st('d4t'),hint:st('d4h'),l:[`${n} → ${n/2} → <b>${q}</b>`]});
  if(b===8)out.push({e:'✂️',t:st('d8t'),hint:st('d8h'),l:[`${n} → ${n/2} → ${n/4} → <b>${q}</b>`]});

  if(b===5)out.push(n%10===0?{e:'✋',t:st('d5aT'),hint:`${n} : 10, ${X()} 2`,l:[`${n} : 10 = ${n/10}`,`${n/10} ${X()} 2 = <b>${q}</b>`]}
                            :{e:'✋',t:st('d5bT'),hint:`${n} ${X()} 2, : 10`,l:[`${n} ${X()} 2 = ${n*2}`,`${n*2} : 10 = <b>${q}</b>`]});
  out.push({e:'🍬',t:st('dgT'),hint:st('dgH',n,b),l:[st('dgA',n,b),st('dgB',q)],v:groups(b,q)});
  if(q<=10)out.push({e:'🦘',t:st('djT',b),hint:st('djH',b,n),l:[seq(b,q),st('djB',q)]});
  return out;
}
function remStrats(n,b){
  if(b<=0||n%b===0)return divStrats(n,b);
  const q=Math.floor(n/b),r=n%b;
  return [
    {e:'🔎',t:st('rtT',b),hint:st('rtH',b,n),l:[st('rtA',b,n,q*b,q),st('rtB',q),st('rtC',n,q*b,r)],v:tableChips(b,n)},

}
/* adunare */
function addStrats(a,b){
  const s=a+b,big=Math.max(a,b),sm=Math.min(a,b),out=[];
  if(a<=10&&b<=10){
    const swap=a<b?st('swapAdd',a,b):null;

      out.push({e:'🔟',t:st('a10T'),hint:st('a10H',big),l:[swap,st('a10A',big,need),st('a10B',sm,need,sm-need),st('a10C',big,need,sm-need,s)].filter(Boolean),v:tenFrames(big,sm)});}
    if(a===b)out.push({e:'👯',t:st('dblT'),hint:st('dblH',a),l:[st('dblA',a,s),st('dblB',a)]});
    else if(big-sm===1)out.push({e:'👯',t:st('ndT'),hint:st('ndH',sm),l:[`${sm} + ${sm} = ${sm*2}`,st('ndB',big,sm*2,s)]});
    else if(big-sm===2)out.push({e:'⚖️',t:st('dmidT'),hint:st('dmidH',big,sm),l:[st('dmidA',big,sm,a,b,sm+1),`${sm+1} + ${sm+1} = <b>${s}</b>`]});
    if(big===9&&sm>0)out.push({e:'🎯',t:'+9 = +10 − 1',hint:st('p9H'),l:[`${sm} + 10 = ${sm+10}`,st('p9B',sm+10,s)],v:numberLine(sm,[10,-1])});
    else if(big===8&&sm>=2)out.push({e:'🎯',t:'+8 = +10 − 2',hint:st('p8H'),l:[`${sm} + 10 = ${sm+10}`,`${sm+10} − 2 = <b>${s}</b>`],v:numberLine(sm,[10,-2])});
    if(sm>0&&sm<=3)out.push({e:'🦘',t:st('cfT'),hint:st('cfH',big),l:[swap,st('cfA',big,sm,Array.from({length:sm},(_,i)=>big+i+1).join(' → '))].filter(Boolean),v:numberLine(big,Array(sm).fill(1))});
    if(big<10&&s>10)out.push({e:'📏',t:st('nlT'),l:[st('nlA')],v:numberLine(big,[10-big,s-10])});
    if(!out.length)out.push({e:'📏',t:st('nlT'),l:[st('nlB',big,sm,s)],v:numberLine(big,[sm])});
    return out;
  }
  const z=Math.floor(b/10)*10,u=b%10,az=Math.floor(a/10)*10,au=a%10;
  out.push({e:'🪜',t:st('tuT'),hint:st('tuH',a,z,u),l:[`${a} + ${z} = ${a+z}`,u?`${a+z} + ${u} = <b>${s}</b>`:`= <b>${s}</b>`],v:numberLine(a,u?[z,u]:[z])});
  out.push({e:'🧱',t:st('ttT'),hint:st('ttH'),l:[`${st('ttA')}: ${az} + ${z} = ${az+z}`,`${st('ttB')}: ${au} + ${u} = ${au+u}`,`${az+z} + ${au+u} = <b>${s}</b>`]});
  if(u>=8){const rb=b+10-u;out.push({e:'🎯',t:st('rndT'),hint:st('rndH',b,rb),l:[st('rndH',b,rb)+'.',`${a} + ${rb} = ${a+rb}`,st('rndB',a+rb,10-u,s)],v:numberLine(a,[rb,-(10-u)])});}

/* scădere */
function subStrats(c,b){
  const d=c-b,out=[];

  if(c<=20&&b<=10){

      out.push({e:'🔄',t:st('cuT'),hint:`${b} + ? = ${c}`,l:[st('cuA',b,c),st('cuB',b,10-b),st('cuC',c,c-10),`${10-b} + ${c-10} = <b>${d}</b>`],v:numberLine(b,[10-b,c-10])});
      out.push({e:'🔟',t:st('t10T'),hint:st('t10H'),l:[st('t10A',b,first,rest),`${c} − ${first} = 10`,`10 − ${rest} = <b>${d}</b>`],v:numberLine(c,[-first,-rest])});
    }else out.push({e:'🔄',t:st('thT'),hint:`${b} + ? = ${c}`,l:[st('cuA',b,c),st('thB',b,d,c)],v:d>0?numberLine(b,[d]):''});
    if(c===2*b)out.push({e:'👯',t:st('diT'),l:[`${b} + ${b} = ${c}`,st('diB',c,b)]});
    if(b===9&&c>=10)out.push({e:'🎯',t:'−9 = −10 + 1',hint:st('m9sH'),l:[`${c} − 10 = ${c-10}`,st('m9sB',c-10,d)],v:numberLine(c,[-10,1])});
    if(b===8&&c>=10)out.push({e:'🎯',t:'−8 = −10 + 2',hint:st('m8sH'),l:[`${c} − 10 = ${c-10}`,`${c-10} + 2 = <b>${d}</b>`],v:numberLine(c,[-10,2])});
    if(b<=3&&b>0)out.push({e:'🦘',t:st('cbT'),l:[Array.from({length:b+1},(_,i)=>c-i).join(' → ')],v:numberLine(c,Array(b).fill(-1))});
    return out;
  }

function clockRead(h,m,lvl){
  const cand=[[h,m],[m/5||12,(h%12)*5],[h%12+1,m],[(h+10)%12+1,m],[h,m/5],[h,(m+30)%60]].filter(([a,b])=>Number.isInteger(a)&&a>=1&&a<=12&&Number.isInteger(b)&&b<60);
  const ds=uniq(cand.slice(1).map(([a,b])=>dig(a,b)).filter(x=>x!==dig(h,m)),3);
  while(ds.length<3){const x=dig(1+rnd(12),pick(minutesSet(lvl)));if(x!==dig(h,m)&&!ds.includes(x))ds.push(x);}
  const words=lvl>=2&&Math.random()<.5;
  const r=words?mc(WD().timeWords(h,m),ds.map(s=>{const [a,b]=s.split(':').map(Number);return WD().timeWords(a,b);})):mc(dig(h,m),ds);
  return {...r,ansText:`${dig(h,m)} · ${WD().timeWords(h,m)}`,prompt:wq('clRead'),vis:clockSVG(h,m),short:`🕐 ${dig(h,m)} · ${WD().timeWords(h,m)}`,strats:clockCards(h,m)};
}
function clockLater(h,m,d){

  const ds=uniq([dig(h,(m+d)%60),dig(h2%12+1,m2),dig(h,m),dig(h2,(m2+30)%60)].filter(x=>x!==right),3);

function worldQ(key){
  const [,world,type,...ps]=key.split('|');const g=GEN[world][type];
  const params=ps.map(p=>/^-?\d+$/.test(p)?+p:p);
  const q=g[2](params);
  return Object.assign(q,{key,op:'w',w:world,type,lvl:g[0],fk:`w|${world}|${type}`,ahead:g[0]===3,text:q.short,say:q.say||strip(q.prompt)});
}
const newWorldKey=(world,type)=>['w',world,type,...GEN[world][type][1]()].join('|');
function worldTypes(world,maxLvl){return Object.keys(GEN[world]).filter(t=>GEN[world][t][0]<=maxLvl);}
function buildWorldSession(world,lvl,len,forced){
  const types=worldTypes(world,lvl);const out=forced?forced.slice(0,len):[];let last='';
  while(out.length<len){
    const w=types.map(t=>{let x=GEN[world][t][0]===lvl?3:1;const s=status(`w|${world}|${t}`);if(s===0)x+=1;if(s===1||s===2)x+=2;if(t===last)x*=.2;return x;});
    let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(r>w[i]){r-=w[i];i++;}

function importData(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.facts)throw 0;
  localStorage.setItem(LS,JSON.stringify(d));S=load();save();toast(t('imported'));applyI18n();renderParent();updateHeader();}catch(e){toast(t('invalid'));}};r.readAsText(f);inp.value='';}
function resetAll(){if(confirm(t('confirmReset'))){const l=S.lang;S=defState();S.lang=l;save();toast(t('deleted'));go('onboard');obStep(2);}}

/* ================= ACHIEVEMENTS ================= */
function achList(){
  const a=t('ach'),c=Object.keys(S.coll).length,cnt=k=>poolOf(k).filter(x=>status(x)>=4).length;
  const l=[
    ['first','🚀',a.first,()=>S.missions>=1],['assess','🔍',a.assess,()=>S.assessDone],['streak3','🔥',a.streak3,()=>streak()>=3],
    ['combo10','⚡',a.combo10,()=>S.maxCombo>=10],['c100','💯',a.c100,()=>S.correct>=100],['m10','🎯',a.m10,()=>S.missions>=10],
    ['coll10','🐾',a.coll10,()=>c>=10],['streak7','📅',a.streak7,()=>streak()>=7],['gold5','🏆',a.gold5,()=>(S.cups[3]||0)>=5],
    ['combo20','🌋',a.combo20,()=>S.maxCombo>=20],['c500','🧠',a.c500,()=>S.correct>=500],['m50','👑',a.m50,()=>S.missions>=50],['coll25','🦄',a.coll25,()=>c>=25]];
  for(let n=2;n<=10;n++)l.push(['mul'+n,'✖️',a.table(n),()=>{for(let x=1;x<=10;x++)if(status(`mul|${n}|${x}`)<4||status(`mul|${x}|${n}`)<4)return false;return true;}]);
  const wa=WD().ach;WORLDS.forEach(w=>l.push(['w_'+w,WE[w],wa[w],()=>((S.wstats[w]||{}).m||0)>=3]));
  l.push(['pioneer','🌱',wa.pioneer,()=>WORLDS.some(w=>((S.wstats[w]||{}).l3||0)>=1)],['explorer','🗺️',wa.explorer,()=>WORLDS.every(w=>S.wseen[w])]);
  l.push(['add','➕',a.add,()=>cnt('add')>=90],['sub','➖',a.sub,()=>cnt('sub')>=90],['div','➗',a.div,()=>cnt('div')>=90],['rem','🍬',a.rem,()=>cnt('rem')>=60]);
  return l;
}
function checkAch(){achList().forEach(([id,e,n,test])=>{if(!S.badges.includes(id)&&test()){S.badges.push(id);save();setTimeout(()=>{toast(`${e} ${t('newAch',n)}`,3200);sound('great');buzz([40,40,80]);},400);}});}
function openRoom(){go('room');}
function renderRoom(){
  $('roomCups').innerHTML=`<span><i>🏆</i>${S.cups[3]||0}</span><span><i>🥈</i>${S.cups[2]||0}</span><span><i>🥉</i>${S.cups[1]||0}</span>`;
  $('collTitle').textContent=t('coll',Object.keys(S.coll).length,CREATURES.length);
  $('roomColl').innerHTML=CREATURES.map(([e,r])=>S.coll[e]?`<div class="r${r}" title="${t('rar')[r]}">${e}${S.coll[e]>1?`<sup>×${S.coll[e]}</sup>`:''}</div>`:`<div class="lock">❔</div>`).join('');
  $('roomAch').innerHTML=achList().map(([id,e,n])=>`<span class="badge ${S.badges.includes(id)?'':'off'}">${S.badges.includes(id)?e:'🔒'} ${n}</span>`).join('');
}

/* ================= ONBOARDING / HOME ================= */
function obStep(n){go('onboard');[1,2,3].forEach(i=>$('ob'+i).classList.toggle('hidden',i!==n));if(n===2)setTimeout(()=>$('nameIn').focus(),200);if(n===3)renderBuddies();}
function obName(){const n=$('nameIn').value.trim();if(!n){$('nameIn').focus();return;}S.name=n;save();obStep(3);}
$('nameIn').addEventListener('keydown',e=>{if(e.key==='Enter')obName();});
function renderBuddies(){$('obBuddyTxt').textContent=t('obBuddy',S.name);$('obAv').textContent=S.buddy;
  $('buddyList').innerHTML=BUDDIES.map(b=>`<button class="${S.buddy===b?'on':''}" onclick="S.buddy='${b}';save();renderBuddies();sound('ok')">${b}</button>`).join('');}
function obDone(){save();go('home');}
function go(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));window.scrollTo(0,0);
  if(id!=='quiz'&&id!=='brk')document.body.classList.remove('focus');
  applyI18n();
  if(id==='home')renderHome();
  if(id==='missionSetup')renderMissions();
  if(id==='assessSetup')renderAssessList();
  if(id==='parent')renderParent();
  if(id==='room')renderRoom();
  if(id==='explore'){renderExOps();renderExplore();}
  if(id==='worlds')renderWorlds();
  if(id==='world')renderWorld();
}
function updateHeader(){$('hdrStars').textContent=`⭐ ${S.stars}`;}
function level(){let i=0;LEVELS.forEach((v,j)=>{if(S.stars>=v)i=j;});return t('levels')[i];}
function renderHome(){
  updateHeader();$('homeAv').textContent=S.buddy;
  const seen=Object.keys(S.facts).filter(k=>!k.startsWith('big')).length,sk=streak();
  $('homeMsg').textContent=!seen?msg('homeFirst'):sk>=2?msg('homeStreak',{k:sk}):msg('home');
  $('homeStats').innerHTML=`<span class="pill">🎖️ ${level()}</span><span class="pill">🔥 ${sk} ${t('streakDays')}</span><span class="pill">🏆 ${(S.cups[1]||0)+(S.cups[2]||0)+(S.cups[3]||0)}</span><span class="pill">🐾 ${Object.keys(S.coll).length}/${CREATURES.length}</span>`;
  $('bAssess').classList.toggle('hl',!seen);
  $('bWorldsT').textContent=WD().btn;$('bWorldsS').textContent=WD().btnSub;$('bWorldsNew').innerHTML=WORLDS.some(w=>!S.wseen[w])?`<span class="newtag">${WD().isNew}</span>`:'';
}
function buddyTalk(){$('homeMsg').textContent=msg('tap');sound('ok');}
function renderMissions(){const m=t('missions');
  $('missionList').innerHTML=Object.keys(m).map(k=>`<div class="li" onclick="startMission('${k}')"><span style="font-size:19px">${m[k][0]} ${m[k][1]}</span><span class="muted">${m[k][2]} ➜</span></div>`).join('');}
function renderAssessList(){const it=t('assessItems');
  $('assessList').innerHTML=Object.keys(it).map(k=>`<div class="li" onclick="startAssess('${k}')"><span>${it[k][0]}</span><span class="muted">${it[k][1]} ➜</span></div>`).join('');}

/* ================= HELPERS ================= */
function openModal(ti,h){$('mTitle').textContent=ti;$('mBody').innerHTML=h;$('modal').classList.add('on');}
function closeModal(){$('modal').classList.remove('on');}
let toastT;function toast(m,ms=1800){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>e.style.display='none',ms);}
function burst(){const em=['⭐','✨','🌟','💫'];for(let i=0;i<10;i++){const s=document.createElement('span');s.className='burst';s.textContent=pick(em);
  s.style.left='50%';s.style.top='35%';s.style.setProperty('--dx',(Math.random()*300-150)+'px');s.style.setProperty('--dy',(Math.random()*-220-20)+'px');document.body.appendChild(s);setTimeout(()=>s.remove(),1000);}}
function buzz(p){try{if(S.settings.vib&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
let AC;function sound(kind){if(!S.settings.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
  const notes=kind==='great'?[660,880,1100]:kind==='ok'?[520,660]:[300,220];
  notes.forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type=kind==='bad'?'triangle':'sine';o.frequency.value=f;const t0=AC.currentTime+i*.09;
    g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(.18,t0+.02);g.gain.exponentialRampToValueAtTime(.0001,t0+.2);o.connect(g).connect(AC.destination);o.start(t0);o.stop(t0+.22);});}catch(e){}}
let UTT=null; // referință păstrată: pe Android, Chrome altfel „pierde” fraza
function voiceFor(lg){try{const n=x=>(x||'').replace('_','-').toLowerCase(),vs=speechSynthesis.getVoices();
  return vs.find(v=>n(v.lang)===lg.toLowerCase())||vs.find(v=>n(v.lang).startsWith(lg.slice(0,2)));}catch(e){return null;}}
function speak(txt,onInfo){
  try{
    const ss=window.speechSynthesis;if(!ss||!window.SpeechSynthesisUtterance){onInfo&&onInfo(t('ttsNone'));return;}
    const lg=t('speechLang');
    const go=()=>{
      UTT=new SpeechSynthesisUtterance(txt);UTT.lang=lg;UTT.rate=.9;UTT.volume=1;
      const v=voiceFor(lg);if(v)UTT.voice=v;
      UTT.onstart=()=>{onInfo&&onInfo(t('ttsOk',v?v.name:lg));};
      UTT.onerror=e=>{if(e.error!=='interrupted'&&e.error!=='canceled')onInfo&&onInfo(ss.getVoices().length&&!v?t('ttsNoVoice'):t('ttsErr',e.error));};
      ss.resume();ss.speak(UTT);
      if(onInfo&&ss.getVoices().length&&!v)setTimeout(()=>onInfo(t('ttsNoVoice')),1500);
    };
    if(ss.speaking||ss.pending){ss.cancel();setTimeout(go,150);}else go();   // evită eroarea cancel→speak
  }catch(e){onInfo&&onInfo(t('ttsErr',e.message||e));}
}
function speakQ(){if(!cur)return;const sp=t('sp');let txt=cur.say||`${cur.a} ${sp[cur.sign]||cur.sign} ${cur.b}`;
  if(cur.kind==='mc'&&!cur.opts.some(o=>o.includes('<')))txt+=(/[?!.]\s*$/.test(txt)?' ':'. ')+cur.opts.map(strip).join(', ');   // citește și variantele scrise
  speak(txt);cur.lastAct=performance.now();}
function stopSpeak(){try{if(window.speechSynthesis)speechSynthesis.cancel();}catch(e){}}
function updSpk(){const b=$('spkBtn');if(!b)return;b.textContent=S.settings.speak?'🔊':'🔇';b.classList.toggle('on',!!S.settings.speak);}
function toggleSpeak(){S.settings.speak=!S.settings.speak;save();updSpk();if(S.settings.speak)speakQ();else stopSpeak();say(S.settings.speak?t('spkOn'):t('spkOff'),3000);}
function testVoice(){$('ttsInfo').textContent='…';speak(t('voiceSample',S.name||''),m=>{$('ttsInfo').textContent=m;});}
if('speechSynthesis' in window){try{speechSynthesis.getVoices();speechSynthesis.onvoiceschanged=()=>speechSynthesis.getVoices();}catch(e){}}

/* ================= START ================= */
applyI18n();updateHeader();
if(!S.lang)obStep(1);else if(!S.name)obStep(2);else go('home');
document.querySelectorAll('#parent input[type=checkbox]').forEach(c=>c.addEventListener('change',()=>{saveSettings(true);if(c.id==='ckSpeak'&&c.checked)testVoice();}));
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}
if(IS_TEST){$('testBanner').textContent=t('testBanner');$('testBanner').classList.remove('hidden');}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
